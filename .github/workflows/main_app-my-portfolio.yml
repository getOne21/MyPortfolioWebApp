# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-my-portfolio

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.15.0'

      - name: Install, verify, build, and stage App Service package
        run: |
          npm ci
          npm run lint
          npm run test:ci
          npm run build
          mkdir -p dist/app-service/browser
          cp deploy-app/package.json deploy-app/server.js dist/app-service/
          cp -R dist/portfolio/browser/. dist/app-service/browser/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: app-service-package
          path: dist/app-service

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: app-service-package
          path: app-service

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_100EAFDA18C248A69DD07C87CC2A941F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B2E5927F6B614E158435228757012AD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7D89E0F8F05453AA15FD0F7FDEEFD17 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-my-portfolio'
          slot-name: 'Production'
          package: app-service

