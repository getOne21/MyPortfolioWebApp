<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">

  <!-- Soft outer glow ring -->
  <circle cx="50" cy="50" r="49" fill="#5E92F3" fill-opacity="0.25"/>

  <!-- Icon background disc (white – stands out on both light and dark surfaces) -->
  <circle cx="50" cy="50" r="43" fill="white"/>

  <!-- ── WiFi / network arcs (primary blue, 3 concentric arcs) ── -->
  <path d="M18 39 Q50 16 82 39"
        stroke="#1565C0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3"/>
  <path d="M26 49 Q50 28 74 49"
        stroke="#1565C0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M35 58 Q50 40 65 58"
        stroke="#1565C0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Access-point dot -->
  <circle cx="50" cy="64" r="4" fill="#1565C0"/>

  <!-- ── NAS server chassis ── -->
  <rect x="14" y="71" width="72" height="22" rx="7" fill="#E3F2FD"/>
  <rect x="15.5" y="72.5" width="69" height="19" rx="6"
        stroke="#1565C0" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Drive bay 1 -->
  <rect x="22" y="77" width="44" height="7" rx="3.5" fill="#1565C0" fill-opacity="0.15"/>
  <circle cx="71" cy="80.5" r="3"  fill="#4ADE80"/>

  <!-- Drive bay 2 -->
  <rect x="22" y="86.5" width="44" height="7" rx="3.5" fill="#1565C0" fill-opacity="0.15"/>
  <circle cx="71" cy="90"   r="3"  fill="#FCD34D"/>

</svg>
